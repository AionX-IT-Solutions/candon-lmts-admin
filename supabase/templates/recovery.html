<html>
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f4f6fb;
      font-family: Arial, sans-serif;
      color: #172033;
    "
  >
    <table
      role="presentation"
      style="width: 100%; max-width: 520px; margin: 0 auto; border-collapse: collapse"
    >
      <tr>
        <td
          style="padding: 28px; border: 1px solid #e3e8f0; border-radius: 16px; background: #ffffff"
        >
          <p
            style="
              margin: 0 0 8px;
              color: #2563eb;
              font-size: 13px;
              font-weight: 700;
              letter-spacing: 1px;
              text-transform: uppercase;
            "
          >
            Candon eSession
          </p>
          <h1 style="margin: 0 0 16px; font-size: 24px">Reset your password</h1>
          <p style="margin: 0 0 24px; color: #526078; line-height: 1.6">
            Enter this one-time code in the app to choose a new password. It can only be used once.
          </p>
          <p
            style="
              margin: 0 0 24px;
              padding: 16px;
              border-radius: 12px;
              background: #eff4ff;
              color: #1d4ed8;
              font-size: 32px;
              font-weight: 700;
              letter-spacing: 8px;
              text-align: center;
            "
          >
            {{ .Token }}
          </p>
          <p style="margin: 0; color: #6b7280; font-size: 13px; line-height: 1.5">
            If you did not request a password reset, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
