# Supabase CLI config for Candon LMTS (project ref: mjnmcnxorpkpddefcrmr).
# Only the settings this project relies on are listed; the CLI fills in the rest.
project_id = "candon-lmts-admin"

[auth.email]
enable_confirmations = false

[auth.email.template.recovery]
subject = "Candon eSession password reset code"
content_path = "./supabase/templates/recovery.html"

[auth.email.smtp]
sender_name = "Candon eSession"

[functions.admin-users]
# The function verifies the caller's session itself (auth.getUser), so the gateway check is
# off — this also keeps it working with Supabase's newer asymmetric JWT signing keys.
verify_jwt = false

[functions.notify-users]
# The function verifies the caller's session itself, then uses the service key to target users.
verify_jwt = false
